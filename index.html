<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <form action="" id="book_entry">
        <label for="title">Title</label>
        <input novalidate type="text" name="title" id="title" minlength="3" required>
        <span class="error"></span>
        <br>
        <label for="author">Author</label>
        <input novalidate type="text" name="author" id="author" minlength="4" required>
        <span class="error"></span>
        <br>
        <label for="year_published">Year Published</label>
        <input type="number" min="1000" max="2100" name="year_published" id="year_published" required>
        <span class="error"></span>
        <br>
        <label for="read_status">Read?</label>
        <input type="checkbox" name="read_status" id="read_status">
        <button type="submit" id="add_book">Add to Library</button>
    </form>

    <div class="display-case">

    </div>


        <script src="script.js"></script>
</body>
</html>
